name: Feature idea
description: Suggest something that would make Helm better for working with Claude Code
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the moment where Helm gets in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough ideas are fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
