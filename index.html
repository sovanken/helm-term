<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helm</title>
    <script src="/boot.js"></script>
    <style>
      /* Splash: shown from the first frame until the app has loaded its tabs, then faded out. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: var(--splash-bg, #0c0d0f);
        transition: opacity 220ms ease-out;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 64px;
        height: 64px;
      }
      #splash .bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--splash-track, #25262b);
        animation: splash-fade 300ms 400ms both;
      }
      #splash .bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: var(--splash-accent, #e7a85a);
        animation: splash-sweep 1.1s ease-in-out infinite;
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .bar,
        #splash .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Helm is starting">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <mask id="splash-back" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect width="1024" height="1024" fill="#fff" />
            <rect x="74" y="394" width="672" height="522" rx="104" fill="#000" />
          </mask>
          <mask id="splash-front" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect width="1024" height="1024" fill="#fff" />
            <polyline points="189,569 284,655 189,741" fill="none" stroke="#000" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
            <line x1="339" y1="741" x2="451" y2="741" stroke="#000" stroke-width="64" stroke-linecap="round" />
          </mask>
        </defs>
        <rect x="348" y="150" width="576" height="440" rx="78" fill="#b46c30" mask="url(#splash-back)" />
        <rect x="100" y="420" width="620" height="470" rx="78" fill="#e7a85a" mask="url(#splash-front)" />
      </svg>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
