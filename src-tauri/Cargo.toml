[package]
name = "helm"
version = "1.0.0"
description = "A terminal made for Claude Code"
authors = ["Helm contributors"]
license = "MIT"
repository = "https://github.com/sovanken/helm-term"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "helm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
arboard = "3"
png = "0.18"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
which = "8"
base64 = "0.22"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
